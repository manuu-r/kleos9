name: Deploy backend manually

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Configured GitHub deployment environment
        type: environment
        required: true
      initial_deployment:
        description: Start provisioned services currently at zero replicas
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      CONTROL_REPOSITORY: ${{ vars.CONTROL_ECR_REPOSITORY }}
      API_URL: ${{ vars.API_URL }}
      INITIAL_DEPLOYMENT: ${{ inputs.initial_deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and checks
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps ./backend
      - name: Verify before obtaining deployment credentials
        run: |
          python -m pytest backend/tests -q -m "not postgres"
          ruff check backend/kleos backend/tests backend/docker/deploy.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, migrate, drain and deploy
        run: |
          args=()
          if [ "$INITIAL_DEPLOYMENT" = "true" ]; then args+=(--initial-deployment); fi
          python backend/docker/deploy.py release \
            --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
            --repository "$CONTROL_REPOSITORY" --api-url "$API_URL" \
            --version "$GITHUB_SHA" --release-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${args[@]}"
      - name: Preserve release and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment_manifest.json
          if-no-files-found: ignore
          retention-days: 90
