name: Verify Kleos9
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kleos
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kleos_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kleos -d kleos_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      KLEOS_TEST_POSTGRES_URL: postgresql://kleos:ci-only@localhost:5432/kleos_test_ci
      KLEOS_DATABASE_URL: postgresql+psycopg://kleos:ci-only@localhost:5432/kleos_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.8.11
          uv sync --locked
      - name: Check backend, migrations and durable recovery
        working-directory: backend
        run: |
          uv run --no-sync ruff check src tests migrations
          uv run --no-sync python -m kleos.cli migrate
          uv run --no-sync alembic check
          uv run --no-sync pytest -q
          uv run --no-sync python -m kleos.cli export-runtime-contracts --output "$RUNNER_TEMP/kleos-runtime-openapi.json"
          git diff --exit-code -- contracts/openapi.json
      - name: Verify simulated flows
        working-directory: mock-backend
        run: |
          ../backend/.venv/bin/python -m pytest tests -q
          bash -n deploy.sh
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Verify production and mock frontend
        working-directory: kleos-ui
        run: |
          flutter pub get --enforce-lockfile
          python3 tool/generate_transport.py --check
          flutter analyze
          flutter test
          flutter build web --dart-define=KLEOS_BACKEND=production
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
      - working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
