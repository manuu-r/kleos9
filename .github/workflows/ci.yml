name: Verify Kleos9
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kleos
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kleos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kleos -d kleos"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      KLEOS_TEST_POSTGRES_URL: postgresql://kleos:ci-only@localhost:5432/kleos
      KLEOS_DATABASE_URL: postgresql+psycopg://kleos:ci-only@localhost:5432/kleos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Check backend, migrations and durable recovery
        working-directory: backend
        run: |
          ruff check .
          alembic upgrade head
          alembic check
          pytest -q
          python -m kleos.cli export-contracts
          git diff --exit-code -- contracts/openapi.json
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Verify production and mock frontend
        working-directory: kleos-ui
        run: |
          flutter pub get --enforce-lockfile
          python3 tool/generate_transport.py --check
          flutter analyze
          flutter test
          flutter build web --dart-define=KLEOS_BACKEND=production
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
      - working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
