name: kleos_ui
description: Flutter frontend for the simulated Kleos9 hardware workbench.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  go_router: ^14.8.1
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  flutter_appauth: ^11.0.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  crypto: ^3.0.6
  web: ^1.1.1
dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/device.generated.json
    - assets/fonts/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
