receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    # Application exporters strip credentials, prompts, SQL and exception bodies.
    # Local diagnostic metadata includes IDs so asynchronous work can be traced.
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
