# Local replacement only. No cloud rollout, inherited .env, native Docker socket or automatic model worker.
name: kleos2-local

x-runtime-env: &runtime-env
  KLEOS2_ENVIRONMENT: development
  KLEOS2_DATABASE_URL: ${KLEOS2_DATABASE_URL:?Set the fresh local database URL in an explicit private env file}
  KLEOS2_SESSION_SECRET: ${KLEOS2_SESSION_SECRET:?Set a persistent strong session secret}
  KLEOS2_SETUP_TOKEN: ${KLEOS2_SETUP_TOKEN:?Set the fresh installation setup token}
  KLEOS2_ARTIFACT_ROOT: /var/lib/kleos/artifacts
  KLEOS2_DEVELOPMENT_NO_LOGIN: "false"
  KLEOS2_PHYSICAL_ACTIONS_ENABLED: "false"
  KLEOS2_FRONTEND_ORIGIN: ${KLEOS2_FRONTEND_ORIGIN:-http://localhost:5180}
  KLEOS2_API_ORIGIN: ${KLEOS2_API_ORIGIN:-http://localhost:8000}
  KLEOS2_PREVIEW_ORIGIN: ${KLEOS2_PREVIEW_ORIGIN:-http://localhost:8004}
  KLEOS2_COMPANION_PREVIEW_ENABLED: ${KLEOS2_COMPANION_PREVIEW_ENABLED:-false}
  KLEOS2_META_API_KEY: ${KLEOS2_META_API_KEY:-${KLEOS_META_API_KEY:-}}
  KLEOS_META_API_KEY: ${KLEOS_META_API_KEY:-}
  KLEOS2_MODAL_API_KEY: ${KLEOS2_MODAL_API_KEY:-${KLEOS_MODAL_LLM_KEY:-}}
  KLEOS_MODAL_LLM_KEY: ${KLEOS_MODAL_LLM_KEY:-}
  KLEOS2_MODAL_BASE_URL: ${KLEOS2_MODAL_BASE_URL:-${KLEOS_MODAL_LLM_URL:-}}
  KLEOS_MODAL_LLM_URL: ${KLEOS_MODAL_LLM_URL:-}
  KLEOS2_MODEL_PROVIDER: ${KLEOS2_MODEL_PROVIDER:-meta}
  # Unset optional selections stay absent, preserving the runtime provider defaults.
  KLEOS2_MODEL_CATALOG:
  KLEOS2_TEXT_MODEL_KEY:
  KLEOS2_VISION_MODEL_KEY:
  KLEOS2_MODAL_RATE_LIMIT_FALLBACK_KEY:
  KLEOS2_MAX_MODEL_CALLS: ${KLEOS2_MAX_MODEL_CALLS:-100}
  KLEOS2_MAX_MODEL_COST_MICRO_USD: ${KLEOS2_MAX_MODEL_COST_MICRO_USD:-5000000}

x-control: &control
  image: ${KLEOS2_CONTROL_IMAGE:-kleos2-control:local}
  pull_policy: never
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
  cpus: 1.0
  mem_limit: 1g
  pids_limit: 128
  restart: "no"
  stop_grace_period: 45s
  environment: *runtime-env
  volumes: [artifacts:/var/lib/kleos/artifacts]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    pull_policy: never
    environment:
      POSTGRES_DB: kleos2_local
      POSTGRES_USER: kleos
      POSTGRES_PASSWORD: ${KLEOS2_POSTGRES_PASSWORD:?Set the fresh database password}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kleos -d kleos2_local"]
      interval: 3s
      timeout: 3s
      retries: 20
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    restart: "no"

  migrate:
    <<: *control
    profiles: [setup]
    command: [migrate]
    environment:
      KLEOS2_DATABASE_URL: ${KLEOS2_DATABASE_URL:?Set the fresh local database URL}

  api:
    <<: *control
    command: [serve, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${KLEOS2_LOCAL_API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6

  worker:
    <<: *control
    profiles: [worker]
    command: [worker]

  preview:
    <<: *control
    profiles: [preview]
    command: [preview-serve, --host, 0.0.0.0, --port, "8004"]
    ports: ["127.0.0.1:${KLEOS2_LOCAL_PREVIEW_PORT:-8004}:8004"]
    volumes: [artifacts:/var/lib/kleos/artifacts:ro]
    environment:
      <<: *runtime-env
      # The static preview process does not receive provider credentials.
      KLEOS2_META_API_KEY: ""
      KLEOS2_MODAL_API_KEY: ""
      KLEOS2_MODAL_BASE_URL: ""
      KLEOS2_SETUP_TOKEN: ""
      KLEOS_META_API_KEY: ""
      KLEOS_MODAL_LLM_KEY: ""
      KLEOS_MODAL_LLM_URL: ""

volumes:
  postgres:
  artifacts:
