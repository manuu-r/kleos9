[project]
name = "kleos-backend"
version = "2.0.0"
description = "Task-oriented hardware engineering with LangGraph and LangMem"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn[standard]>=0.34,<1",
 "pydantic-settings>=2.8,<3",
 "sqlalchemy>=2.0,<3",
 "psycopg[binary,pool]>=3.2,<4",
 "alembic>=1.15,<2",
 "langgraph==1.2.19",
 "langmem==0.0.30",
 "langgraph-checkpoint-postgres==3.2.0",
 "langchain-openai==1.7.3",
 "httpx>=0.28,<1",
 "cryptography>=44",
 "pillow>=13,<14",
 "pypdf>=5,<7",
 "mcp==1.26.0",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kleos"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
