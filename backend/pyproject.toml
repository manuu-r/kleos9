[project]
name = "kleos-backend"
version = "0.1.0"
description = "Durable engineering control plane for Kleos9"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.15",
  "dbos>=2.0",
  "pydantic-ai-slim[openai,google,dbos]>=1.0",
  "boto3>=1.37",
  "qdrant-client>=1.13",
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10",
  "itsdangerous>=2.2",
  "modal>=1.0",
  "pypdf>=5.0",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]
mechanical = ["build123d>=0.9"]

[project.scripts]
kleos = "kleos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kleos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
